name: Обновление каталогов из Linko
on:
  schedule:
    - cron: '7 2,7,12 * * *'   # 07:07, 12:07, 17:07 по Ташкенту
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['last-update.txt', 'README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - name: Фото и заказы с прошлого запуска
        uses: actions/cache/restore@v4
        with:
          path: |
            img2
            img_big
            my_order_items.json
          key: linko-${{ github.run_id }}
          restore-keys: linko-
      - name: Программы
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -q fonts-noto-core >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Linko → сайт
        env:
          LINKO_TOKEN: ${{ secrets.LINKO_TOKEN }}
          LINKO_DATA_KEY: ${{ secrets.LINKO_DATA_KEY }}
        run: python ci.py
      - name: Сохранить фото на следующий раз
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            img2
            img_big
            my_order_items.json
          key: linko-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - name: Отметка (чтобы GitHub не отключил расписание через 60 дней)
        run: |
          date -u +%FT%TZ > last-update.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add last-update.txt; git commit -q -m "обновление каталогов" && git push -q || true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
